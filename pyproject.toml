[project]
name = "cybernetic-genesis"
version = "0.2.0"
description = "Cybernetic agentic Genesis & Inception — schema pack + running Inception runtime."
requires-python = ">=3.11"
license = { text = "MIT" }
[project.optional-dependencies]
runtime = ["fastapi>=0.110", "uvicorn>=0.29"]
test = ["pytest", "jsonschema>=4.18", "pyyaml", "fastapi", "httpx"]
[tool.setuptools.packages.find]
where = ["src"]
